name: Trigger auto deployment for ca-mcp-importer-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-mcp-importer-dev-AutoDeployTrigger-9f445c04-1c22-4ddf-ba94-d1a1a6ae6c32.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAMCPIMPORTERDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAMCPIMPORTERDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAMCPIMPORTERDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: 100.100.0.207:443
          registryUsername: ${{ secrets.CAMCPIMPORTERDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAMCPIMPORTERDEV_REGISTRY_PASSWORD }}
          containerAppName: ca-mcp-importer-dev
          resourceGroup: rg-mcp-azure-docs-dev
          imageToBuild: 100.100.0.207:443/registry/ca-mcp-importer-dev:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


